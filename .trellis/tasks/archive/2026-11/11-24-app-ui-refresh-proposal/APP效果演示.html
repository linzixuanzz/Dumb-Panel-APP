<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>呆呆面板 APP · v2.0 焕新效果演示</title>
<!--
  APP 焕新（参考 iOS 26 干净留白风格）的交互式效果演示，不是 APP 源码；APP 是 Flutter，这里用网页模拟观感与动效。数据为本地模拟。
  参数：?screen=tasks&mode=light&solo=1      ?gallery=tasks:light,logs:dark,...
-->
<style>
*{box-sizing:border-box;margin:0;padding:0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
:root{
  --font:-apple-system,"SF Pro Display","SF Pro Text","Inter","HarmonyOS Sans SC","PingFang SC","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;
  --mono:"SF Mono","JetBrains Mono","Cascadia Code",Consolas,monospace;
  --ease:cubic-bezier(.2,0,0,1);--spring:cubic-bezier(.34,1.56,.64,1);--soft:cubic-bezier(.22,1.15,.36,1);
}
@supports (transition-timing-function:linear(0,1)){:root{
  --spring:linear(0,.009,.035 2.1%,.141,.281 6.7%,.723 12.9%,.938 16.7%,1.017,1.077,1.121,1.149 24.3%,1.159,1.163,1.161,1.154 29.9%,1.129 32.8%,1.051 39.6%,1.017 43.1%,.991,.977 51%,.974 53.8%,.975 57.1%,.997 69.8%,1.003 76.9%,1);
  --soft:linear(0,.006,.025 2.8%,.101 6.1%,.539 18.9%,.721 25.3%,.849 31.5%,.937 38.1%,.968 41.8%,.991 45.7%,1.006 50.1%,1.015 55%,1.017 63.9%,1.001 85.9%,1)}}
body{font-family:var(--font);background:#e9e9ef;color:#111;-webkit-font-smoothing:antialiased;min-height:100vh}
body.dark-stage{background:#121214;color:#eee}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:17px;height:17px}.ic.xs{width:13px;height:13px}.ic.lg{width:27px;height:27px}
.ic.fill{fill:currentColor;stroke:none}

/* ---------- 舞台 ---------- */
.stage{display:grid;grid-template-columns:270px auto 290px;gap:44px;justify-content:center;align-items:start;padding:34px 26px}
.side h1{font-size:22px;line-height:1.3}
.side h1 small{display:block;font-size:12px;letter-spacing:2px;color:#8e8e93;font-weight:700;margin-bottom:6px}
.side p{font-size:13px;line-height:1.7;color:#6e6e73;margin-top:8px}
body.dark-stage .side p{color:#98989f}
.ctl{margin-top:20px}.ctl h4{font-size:11.5px;letter-spacing:1.4px;color:#8e8e93;margin-bottom:8px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{height:32px;padding:0 13px;border-radius:99px;background:rgba(120,120,128,.14);font-size:13px;font-weight:600}
.pill.on{background:#111;color:#fff}
body.dark-stage .pill.on{background:#fff;color:#111}
.screens{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.screens .pill{border-radius:10px;text-align:left}
.notes{position:sticky;top:34px}
.notes h3{font-size:16px;margin-bottom:10px}
.notes ul{list-style:none;display:flex;flex-direction:column;gap:10px}
.notes li{font-size:13px;line-height:1.65;color:#48484d;padding-left:15px;position:relative}
body.dark-stage .notes li{color:#b4b4bb}
.notes li::before{content:"";position:absolute;left:0;top:8px;width:6px;height:6px;border-radius:50%;background:#0a84ff}
.notes .tip{margin-top:16px;font-size:12.5px;color:#8e8e93;line-height:1.7;padding:12px 14px;border-radius:14px;background:rgba(120,120,128,.1)}
body.solo .side,body.solo .notes{display:none}
body.solo .stage{grid-template-columns:auto;padding:18px}
.gallery{display:flex;flex-wrap:wrap;gap:34px;justify-content:center;padding:34px}
.gallery figure{display:flex;flex-direction:column;align-items:center;gap:12px}
.gallery figcaption{font-size:14px;font-weight:700;color:#3a3a3f}
body.dark-stage .gallery figcaption{color:#c7c7cc}

/* ---------- 设备 ---------- */
.device{width:414px;height:868px;padding:12px;border-radius:60px;background:linear-gradient(145deg,#d9d9de,#9a9aa1);box-shadow:0 0 0 1.5px #b9b9bf,0 40px 80px -28px rgba(0,0,0,.45)}
body.dark-stage .device{background:linear-gradient(145deg,#3a3a40,#121215);box-shadow:0 0 0 1.5px #48484f,0 40px 80px -28px rgba(0,0,0,.7)}
.phone{position:relative;width:390px;height:844px;border-radius:48px;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font);isolation:isolate;transition:background .45s,color .45s}
.phone .isl{position:absolute;top:11px;left:50%;width:122px;height:35px;margin-left:-61px;border-radius:20px;background:#000;z-index:80}

/* ---------- 令牌：浅色 / 深色（iOS 系统色） ---------- */
.phone[data-mode="light"]{--bg:#f2f2f7;--card:#fff;--card2:#f2f2f7;--fill:rgba(118,118,128,.12);--text:#000;--text2:#8a8a8e;--text3:#b0b0b5;--sep:rgba(60,60,67,.13);
  --blue:#007aff;--green:#34c759;--red:#ff3b30;--orange:#ff9500;--purple:#af52de;--indigo:#5856d6;--yellow:#ffcc00;
  --cta:#000;--on-cta:#fff;--glass:rgba(255,255,255,.72);--glass-b:rgba(0,0,0,.06);--shadow:0 1px 1px rgba(0,0,0,.02);
  --tint-green:#e9f7ec;--tint-blue:#e8f1fe;--tint-purple:#f4e9fb;--tint-red:#fdecec;--tint-orange:#fff3e3}
.phone[data-mode="dark"]{--bg:#000;--card:#1c1c1e;--card2:#2c2c2e;--fill:rgba(118,118,128,.24);--text:#fff;--text2:#8d8d93;--text3:#5f5f65;--sep:rgba(84,84,88,.55);
  --blue:#0a84ff;--green:#30d158;--red:#ff453a;--orange:#ff9f0a;--purple:#bf5af2;--indigo:#5e5ce6;--yellow:#ffd60a;
  --cta:#fff;--on-cta:#000;--glass:rgba(40,40,44,.72);--glass-b:rgba(255,255,255,.1);--shadow:none;
  --tint-green:#13301b;--tint-blue:#0e2440;--tint-purple:#2c1838;--tint-red:#3a1614;--tint-orange:#3a2608}

/* ---------- 骨架 ---------- */
.sb{position:absolute;top:0;left:0;right:0;height:54px;display:flex;justify-content:space-between;align-items:center;padding:6px 34px 0 42px;font-size:16px;font-weight:700;z-index:70;pointer-events:none}
.sb .r{display:flex;gap:6px;align-items:center}
.homebar{position:absolute;left:50%;bottom:8px;width:136px;height:5px;margin-left:-68px;border-radius:3px;background:var(--text);z-index:75}
.page{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:66px 18px 130px;scrollbar-width:none}
.page::-webkit-scrollbar{display:none}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- 组件 ---------- */
.hdr{display:flex;align-items:center;gap:12px;margin:10px 4px 22px}
.hdr h1{flex:1;font-size:34px;font-weight:800;letter-spacing:-.6px;line-height:1.1}
.cbtn{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;color:var(--blue);flex:none;background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);box-shadow:inset 0 0 0 1px var(--glass-b),inset 0 1px 0 rgba(255,255,255,.6),0 4px 14px -6px rgba(0,0,0,.18);transition:transform .45s var(--spring)}
.phone[data-mode="dark"] .cbtn{box-shadow:inset 0 0 0 1px var(--glass-b),0 4px 14px -6px rgba(0,0,0,.5)}
.cbtn:active{transform:scale(.88)}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:6px 6px 14px}
.sec h2{font-size:22px;font-weight:800;letter-spacing:-.3px}
.sec span{font-size:16px;color:var(--text2);display:flex;align-items:center;gap:4px}
.card{background:var(--card);border-radius:30px;padding:22px;box-shadow:var(--shadow);transition:background .45s}
.card+.card{margin-top:16px}
.ttl{font-size:21px;font-weight:800;letter-spacing:-.2px}
.sub{font-size:14px;color:var(--text2);margin-top:4px;line-height:1.5}
.pillbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 24px;border-radius:23px;background:var(--cta);color:var(--on-cta);font-size:16px;font-weight:800;transition:transform .45s var(--spring)}
.pillbtn:active{transform:scale(.94)}
.seg{position:relative;display:flex;padding:4px;border-radius:99px;background:var(--fill)}
.seg button{position:relative;z-index:1;flex:1;height:36px;border-radius:99px;font-size:15px;font-weight:600;color:var(--text)}
.seg .thumb{position:absolute;top:4px;bottom:4px;left:4px;border-radius:99px;background:var(--card);box-shadow:0 2px 8px rgba(0,0,0,.12);transition:transform .5s var(--spring)}
.phone[data-mode="dark"] .seg .thumb{background:#636366}
.tile{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;flex:none;background:var(--t);color:var(--c)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.list{background:var(--card);border-radius:30px;overflow:hidden}
.row{display:flex;align-items:center;gap:14px;padding:14px 18px;position:relative}
.row+.row::before{content:"";position:absolute;top:0;left:78px;right:0;height:1px;background:var(--sep)}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-size:16.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tx small{display:block;font-size:13.5px;color:var(--text2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rt{text-align:right;line-height:1.25}
.row .rt b{display:block;font-family:var(--mono);font-size:16px;font-weight:700}
.row .rt small{font-size:12px;color:var(--text2)}
.chev{color:var(--text3)}
.cap{font-size:13.5px;color:var(--text2);margin-top:14px;line-height:1.5}
.toggle{width:62px;height:36px;border-radius:18px;background:var(--fill);position:relative;flex:none;transition:background .3s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:30px;height:30px;border-radius:15px;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.18);transition:left .45s var(--spring),width .2s}
.toggle.on{background:var(--green)}.toggle.on::after{left:29px}
.r{animation:rise .7s var(--soft) both;animation-delay:calc(var(--i,0) * 55ms)}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}
.still .r{animation:none}

/* ---------- 任务：缺口卡片 ---------- */
.notch-wrap{position:relative;margin-bottom:26px}
.ncard{position:relative;height:300px;user-select:none;border-radius:30px;background:var(--card);padding:22px 22px 0;overflow:hidden}
.ncard .scroller{display:flex;gap:0;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -22px;height:100%;scrollbar-width:none}
.ncard .scroller::-webkit-scrollbar{display:none}
.slide{flex:none;width:100%;padding:0 22px;scroll-snap-align:start}
.slide .top{display:flex;gap:14px;align-items:center}
.slide .top b{display:block;font-size:22px;font-weight:800;letter-spacing:-.3px}
.slide .top small{display:block;font-size:14px;color:var(--text2);margin-top:2px}
.slide .bars{display:flex;align-items:flex-end;gap:4px;height:54px;margin-top:22px}
.slide .bars i{flex:1;border-radius:4px;background:var(--green);opacity:.85;min-height:6px;transform-origin:bottom}
.slide .bars i.f{background:var(--red);opacity:1}
.slide .meta{display:flex;gap:18px;margin-top:12px;font-size:13px;color:var(--text2)}
.slide .meta b{display:block;color:var(--text);font-size:16px;font-weight:800}
.ncard .foot{position:absolute;left:22px;bottom:20px;font-size:13.5px;color:var(--text2);display:flex;align-items:center;gap:8px}
.ncard .pg{display:flex;gap:5px}.ncard .pg i{width:6px;height:6px;border-radius:3px;background:var(--text3);transition:width .4s var(--spring)}.ncard .pg i.on{width:16px;background:var(--text)}
/* 缺口：底色块 + 两个反向圆角，按钮嵌在里面 */
.notch{position:absolute;right:0;bottom:0;width:208px;height:82px;background:var(--bg);border-top-left-radius:32px;padding:12px 0 0 12px;transition:background .45s}
.notch .c1,.notch .c2{position:absolute;width:30px;height:30px;background:radial-gradient(circle at 0 0,transparent 29.5px,var(--bg) 30px)}
.notch .c1{right:0;top:-30px}
.notch .c2{left:-30px;bottom:0}
.holdpill{position:relative;width:196px;height:70px;border-radius:35px;background:var(--cta);color:var(--on-cta);display:flex;align-items:center;gap:12px;padding:0 8px;font-size:17.5px;font-weight:800;overflow:hidden;user-select:none;isolation:isolate;transition:transform .45s var(--spring)}
.holdpill .ico{width:54px;height:54px;border-radius:27px;background:var(--on-cta);color:var(--cta);display:grid;place-items:center}
.holdpill .fillbar{position:absolute;inset:0;background:color-mix(in oklab,var(--on-cta) 22%,transparent);transform:scaleX(0);transform-origin:left;z-index:-1;transition:transform .15s}
.holdpill.holding{transform:scale(.97)}
.holdpill.holding .fillbar{transform:scaleX(1);transition:transform .7s linear}
.run-ring{position:relative;width:46px;height:46px}
.run-ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.run-ring circle{fill:none;stroke-width:3;stroke-linecap:round}

/* ---------- 日志 ---------- */
.month{display:flex;align-items:center;gap:8px;font-size:32px;font-weight:800;letter-spacing:-.5px;flex:1}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:20px;text-align:center}
.act .sq{width:74px;height:74px;margin:0 auto 10px;border-radius:24px;display:grid;place-items:center;background:var(--t);color:var(--c);transition:transform .45s var(--spring)}
.act:active .sq{transform:scale(.9)}
.act b{font-size:15px;font-weight:700;display:block}
.act small{font-size:12.5px;color:var(--text2)}
.chart{width:100%;height:auto;display:block;margin-top:10px}
.chart text{font-size:11px;fill:var(--text2)}
.chart .gl{stroke:var(--sep);stroke-width:1}
.big-money{font-size:30px;font-weight:800;color:var(--orange);font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.daygrp{font-size:14px;font-weight:700;color:var(--text2);margin:22px 8px 10px;display:flex;justify-content:space-between}
.errline{margin:-4px 18px 12px 78px;padding:10px 12px;border-radius:14px;background:var(--tint-red);color:var(--red);font-family:var(--mono);font-size:12px}

/* ---------- 概览 ---------- */
.wb{display:flex;align-items:center;gap:14px;margin:10px 4px 20px}
.wb .av{width:58px;height:58px;border-radius:50%;overflow:hidden;flex:none;background:#ffd84d}
.wb .av img{width:100%;height:100%}
.wb small{display:block;font-size:15px;color:var(--text2)}
.wb b{display:block;font-size:30px;font-weight:800;letter-spacing:-.5px;line-height:1.15}
.hero{position:relative;border-radius:34px;padding:16px 20px 22px;overflow:hidden;background:
  radial-gradient(120% 90% at 0% 0%,#8b74e6 0%,rgba(139,116,230,.55) 30%,transparent 65%),
  radial-gradient(80% 70% at 100% 0%,rgba(126,160,255,.5),transparent 70%),
  linear-gradient(170deg,#d9d0f6,#f1ecfb 60%,#fbfaff);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 0 0 1px rgba(255,255,255,.5);color:#111}
.phone[data-mode="dark"] .hero{background:radial-gradient(120% 90% at 0% 0%,#5b45c9 0%,rgba(91,69,201,.5) 30%,transparent 65%),radial-gradient(80% 70% at 100% 0%,rgba(60,90,220,.45),transparent 70%),linear-gradient(170deg,#241c40,#18142a 60%,#141220);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.hero .seg{background:rgba(255,255,255,.45);box-shadow:inset 0 0 0 1px rgba(255,255,255,.7)}
.phone[data-mode="dark"] .hero .seg{background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.hero .seg .thumb{background:#fff}
.phone[data-mode="dark"] .hero .seg .thumb{background:rgba(255,255,255,.9)}
.phone[data-mode="dark"] .hero .seg button.on{color:#000}
.hero .h1{display:flex;align-items:center;gap:10px;margin-top:18px;font-size:22px;font-weight:800}
.hero .h1 a{margin-left:auto;font-size:15px;color:var(--blue);font-weight:600}
.hero .num{font-size:62px;font-weight:800;letter-spacing:-2px;line-height:1.05;margin-top:12px;font-variant-numeric:tabular-nums}
.hero .num em{font-style:normal;font-size:30px;letter-spacing:-.5px}
.hero .hside{position:absolute;right:20px;top:122px;text-align:right;font-size:14px;font-weight:600}
.hero .hside b{display:block;font-size:19px;color:var(--red)}
.hero .cap2{font-size:14px;opacity:.6;margin-top:4px}
.hero .lg{display:grid;grid-template-columns:1fr 1fr;margin-top:22px}
.hero .lg span{display:flex;align-items:center;gap:8px;font-size:14px;opacity:.75}
.hero .lg b{display:block;font-size:20px;margin-top:6px;font-weight:800}
.mini2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.mini{background:var(--card);border-radius:28px;padding:18px;position:relative;min-height:116px}
.mini small{font-size:15px;color:var(--text2);font-weight:600}
.mini b{display:block;font-size:20px;font-weight:800;margin-top:10px;letter-spacing:-.3px}
.mini span{font-size:13.5px;color:var(--text2)}
.mini .tile{position:absolute;right:14px;top:14px;width:32px;height:32px;border-radius:10px}
.bars2{display:flex;align-items:flex-end;justify-content:space-between;height:120px;padding:0 6px;margin-top:6px}
.bars2 .m{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--text2)}
.bars2 .m div{display:flex;gap:3px;align-items:flex-end}
.bars2 .m i{width:12px;border-radius:5px;transform-origin:bottom}
.r .bars2 .m i,.r.slide .bars i{animation:grow .8s var(--spring) both;animation-delay:calc(var(--d) * 50ms + .25s)}
@keyframes grow{from{transform:scaleY(0)}}
.still .bars2 .m i{animation:none}
.legend{display:flex;gap:18px;margin-top:14px;font-size:14px;color:var(--text2)}
.legend span{display:flex;align-items:center;gap:6px}
.res .rw{display:flex;align-items:center;gap:12px;font-size:15px;margin-top:12px}
.res .rw span{width:40px;color:var(--text2)}
.res .rw i{flex:1;height:10px;border-radius:5px;background:var(--fill);position:relative;overflow:hidden}
.res .rw i::after{content:"";position:absolute;inset:0;width:var(--w);background:var(--c);border-radius:5px}

/* ---------- 变量 ---------- */
.search{display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:14px;background:var(--fill);color:var(--text2);font-size:17px;margin:0 4px 18px}
.glabel{font-size:14px;color:var(--text2);margin:20px 22px 8px;font-weight:600}
.mask{letter-spacing:2px}

/* ---------- 设置 ---------- */
.prof{position:relative;border-radius:34px;padding:24px;display:flex;align-items:center;gap:16px;overflow:hidden;color:#fff;background:radial-gradient(90% 140% at 100% 100%,#7b5cff 0%,transparent 55%),radial-gradient(70% 120% at 70% 0%,#2f6dff 0%,transparent 60%),linear-gradient(100deg,#000 25%,#0b1640 60%,#1a2e9e);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.prof .stars{position:absolute;inset:0;background-image:radial-gradient(1px 1px at 20% 30%,#fff,transparent),radial-gradient(1px 1px at 40% 70%,#fff,transparent),radial-gradient(1.2px 1.2px at 65% 20%,#fff,transparent),radial-gradient(1px 1px at 80% 60%,#fff,transparent),radial-gradient(1px 1px at 55% 85%,#fff,transparent),radial-gradient(1.3px 1.3px at 90% 35%,#fff,transparent),radial-gradient(1px 1px at 12% 80%,#fff,transparent),radial-gradient(1px 1px at 33% 12%,#fff,transparent);opacity:.7;animation:tw 4s ease-in-out infinite alternate}
@keyframes tw{to{opacity:.35}}
.prof .av{width:76px;height:76px;border-radius:50%;overflow:hidden;flex:none;position:relative;box-shadow:0 0 0 3px rgba(255,255,255,.15)}
.prof .av img{width:100%;height:100%}
.prof b{display:block;font-size:24px;font-weight:800;position:relative}
.prof small{display:block;font-size:15px;opacity:.7;margin-top:4px;position:relative}
.appr{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.apc{border-radius:22px;padding:14px;height:132px;position:relative;border:3px solid transparent;display:flex;flex-direction:column;justify-content:space-between;transition:border-color .3s}
.apc.on{border-color:var(--blue)}
.apc.l{background:#fff;color:#000;box-shadow:0 0 0 1px rgba(0,0,0,.06)}
.apc.d{background:#1c1c1e;color:#fff}
.apc .bar{height:7px;width:40px;border-radius:4px;background:currentColor;opacity:.2}
.apc .blk{display:flex;gap:6px}
.apc .blk i{flex:1;height:30px;border-radius:8px}
.apc b{font-size:22px;font-weight:800}
.apc .sym{position:absolute;right:14px;top:12px}
.lrow{display:flex;align-items:center;gap:16px;padding:18px 20px;font-size:17px;font-weight:600;position:relative}
.lrow+.lrow::before{content:"";position:absolute;top:0;left:62px;right:0;height:1px;background:var(--sep)}
.lrow span{flex:1}
.lrow small{color:var(--text2);font-weight:500;font-size:15px}
.lrow .ii{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:#fff;background:var(--c);flex:none}
.foot-note{font-size:13.5px;color:var(--text2);margin:10px 22px 0;line-height:1.6}

/* ---------- 底栏：玻璃胶囊 + 灰色药丸 ---------- */
.tabbar{position:absolute;left:16px;right:16px;bottom:24px;height:76px;border-radius:38px;z-index:60;display:flex;align-items:center;padding:6px;background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);box-shadow:inset 0 0 0 1px var(--glass-b),inset 0 1px 0 rgba(255,255,255,.7),0 10px 30px -10px rgba(0,0,0,.22)}
.phone[data-mode="dark"] .tabbar{box-shadow:inset 0 0 0 1px var(--glass-b),0 10px 30px -10px rgba(0,0,0,.7)}
.tabbar .ind{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px) / 5);border-radius:32px;background:rgba(120,120,128,.16);transition:transform .55s var(--spring)}
.tabbar button{position:relative;z-index:1;flex:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:700;color:var(--text)}
.tabbar button.on{color:var(--text)}
.tabbar button:not(.on){opacity:.82}
.tabbar button svg{transition:transform .45s var(--spring)}
.tabbar button:active svg{transform:scale(.85)}
.tabbar .nb{position:absolute;top:8px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center}

/* ---------- 详情弹层（iOS 卡片式） ---------- */
.sheet-wrap{position:absolute;inset:0;z-index:65;pointer-events:none}
.sheet-wrap .dim{position:absolute;inset:0;background:rgba(0,0,0,.28);opacity:0;transition:opacity .4s}
.sheet-wrap.on{pointer-events:auto}.sheet-wrap.on .dim{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;top:58px;border-radius:38px 38px 0 0;background:var(--bg);transform:translateY(102%);transition:transform .6s var(--soft);overflow-y:auto;scrollbar-width:none;padding:10px 18px 40px}
.sheet::-webkit-scrollbar{display:none}
.sheet-wrap.on .sheet{transform:none}
.phone.sheeted .scale{transform:scale(.93) translateY(10px);border-radius:38px;filter:brightness(.92)}
.scale{position:absolute;inset:0;transition:transform .6s var(--soft),border-radius .6s,filter .6s;overflow:hidden;transform-origin:50% 0}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--text3);margin:0 auto 14px}
.sheet .stop{display:flex;justify-content:space-between;align-items:center}
.sheet h2{font-size:30px;font-weight:800;letter-spacing:-.6px;margin:14px 4px 4px}
.sheet .stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.sheet .stat3 div{background:var(--card);border-radius:22px;padding:14px;font-size:13px;color:var(--text2)}
.sheet .stat3 b{display:block;font-size:22px;color:var(--text);font-weight:800;margin-top:2px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;text-align:center}
.cal .wd{font-size:12px;color:var(--text2);font-weight:700}
.cal .d{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:700;color:var(--text)}
.cal .d.ok{background:var(--tint-green);color:var(--green)}
.cal .d.f{background:var(--red);color:#fff}
.cal .d.t{box-shadow:0 0 0 2px var(--blue)}
.cal .d.fu{color:var(--text3)}
.logbox{font-family:var(--mono);font-size:12.5px;line-height:1.8;color:var(--text2);white-space:pre-wrap}
.logbox .r{color:var(--red)}.logbox .g{color:var(--green)}.logbox .b{color:var(--blue)}

/* ---------- 锁屏 / 桌面 ---------- */
.lock{position:absolute;inset:0;color:#fff;padding:70px 16px 0;text-align:center;background:radial-gradient(120% 70% at 50% 0%,#3a5bd9,transparent 60%),radial-gradient(90% 60% at 100% 100%,#8a5cf6,transparent 60%),linear-gradient(180deg,#0d1238,#1b1050)}
.lock .date{font-size:20px;font-weight:600;opacity:.9}
.lock .clock{font-size:92px;font-weight:700;letter-spacing:-2px;line-height:1;margin-top:2px}
.la{margin-top:250px;border-radius:30px;padding:16px;text-align:left;background:rgba(30,30,40,.55);-webkit-backdrop-filter:blur(30px) saturate(160%);backdrop-filter:blur(30px) saturate(160%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.la .h{display:flex;align-items:center;gap:10px}
.la .h img{width:40px;height:40px;border-radius:12px}
.la .h b{font-size:16px;flex:1}
.la .h span{font-family:var(--mono);font-size:22px;font-weight:700;color:#5ec2ff}
.la .lg{font-family:var(--mono);font-size:12.5px;opacity:.75;margin:10px 0}
.la .pb{height:6px;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden}
.la .pb i{display:block;height:100%;width:40%;border-radius:3px;background:#5ec2ff;animation:ind 1.6s ease-in-out infinite}
@keyframes ind{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
.la .ft{display:flex;justify-content:space-between;font-size:13px;opacity:.7;margin-top:10px}
.lock .nt{margin-top:12px;border-radius:24px;padding:14px;text-align:left;background:rgba(255,255,255,.16);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);display:flex;gap:10px;align-items:flex-start}
.lock .nt img{width:38px;height:38px;border-radius:10px}
.lock .nt b{display:block;font-size:15px}
.lock .nt small{font-size:13.5px;opacity:.8}
.desk{position:absolute;inset:0;padding:70px 22px 0;background:linear-gradient(170deg,#f6d1c1,#e9b8d8 40%,#a9b6f3 80%)}
.wg{border-radius:28px;background:#fff;color:#000;padding:16px;box-shadow:0 10px 30px -10px rgba(0,0,0,.25)}
.phone[data-mode="dark"] .wg{background:#1c1c1e;color:#fff}
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.wsq{aspect-ratio:1;display:flex;flex-direction:column;justify-content:space-between}
.wsq small{font-size:13px;color:#8a8a8e;font-weight:600}
.wsq b{font-size:34px;font-weight:800;letter-spacing:-1px}
.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:26px;text-align:center;font-size:12px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.25)}
.apps i{display:block;width:62px;height:62px;border-radius:16px;margin:0 auto 6px;background:rgba(255,255,255,.45)}
.apps img{width:62px;height:62px;border-radius:16px;display:block;margin:0 auto 6px;box-shadow:0 6px 14px -6px rgba(0,0,0,.4)}
.menu{position:absolute;left:28px;top:470px;width:250px;border-radius:24px;background:rgba(255,255,255,.88);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);color:#000;box-shadow:0 20px 50px -14px rgba(0,0,0,.4);overflow:hidden}
.menu div{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;font-size:16px;font-weight:500}
.menu div+div{border-top:1px solid rgba(0,0,0,.08)}

/* 过渡 */
#live .scale{view-transition-name:pg}
html[data-vt="tab"]::view-transition-old(pg){animation:fo .12s ease-in both}
html[data-vt="tab"]::view-transition-new(pg){animation:fi .34s .05s var(--ease) both}
@keyframes fo{to{opacity:0}}
@keyframes fi{from{opacity:0;transform:scale(.97)}}
html[data-vt="mode"] #live .scale{view-transition-name:none}
html[data-vt="mode"]::view-transition-old(root),html[data-vt="mode"]::view-transition-new(root){animation:none;mix-blend-mode:normal}
.toast{position:absolute;left:50%;top:60px;transform:translateX(-50%);z-index:78;padding:12px 18px;border-radius:24px;background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);box-shadow:inset 0 0 0 1px var(--glass-b),0 10px 30px -10px rgba(0,0,0,.3);font-size:14.5px;font-weight:700;display:flex;gap:10px;align-items:center;white-space:nowrap;animation:tin .55s var(--spring) both}
@keyframes tin{from{transform:translate(-50%,-30px) scale(.9);opacity:0}}

/* =================================================================
   呆呆面板 APP v2.0 演示（参考 iOS 26 干净留白风格）—— 数据为本地模拟

const $ = (s, e = document) => e.querySelector(s), $$ = (s, e = document) => [...e.querySelectorAll(s)];
const ic = (n, c = '') => `<svg class="ic ${c}" aria-hidden="true"><use href="#${n}"/></svg>`;
const pad2 = n => String(n).padStart(2, '0'), hhmm = d => `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
function rng(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const sp = new URLSearchParams(location.search), M = 'images/mascot.png';
const T = [
  { id: 1, n: '系统健康检查', g: '巡检', cron: '*/20 * * * *', h: '每 20 分钟', avg: 1.4, c: 'blue' },
  { id: 2, n: '每日数据备份', g: '备份', cron: '0 0 * * *', h: '每天 00:00', avg: 42.7, c: 'indigo' },
  { id: 3, n: '离线报表导出', g: '报表', cron: '', h: '手动运行', avg: 196, c: 'purple' },
  { id: 5, n: '同步配置文件', g: '配置', cron: '0 * * * *', h: '每小时整点', avg: 7.1, c: 'green' },
  { id: 6, n: '检查 SSL 证书', g: '巡检', cron: '0 7 * * *', h: '每天 07:00', avg: 2.2, c: 'orange' },
  { id: 7, n: '更新 IP 数据库', g: '数据', cron: '0 */6 * * *', h: '每 6 小时', avg: 12.5, c: 'red', fail: 3 },
  { id: 8, n: '发送运营日报', g: '通知', cron: '0 9 * * 1-5', h: '工作日 09:00', avg: 5.4, c: 'blue' },
  { id: 10, n: '监控指标采集', g: '监控', cron: '*/10 * * * *', h: '每 10 分钟', avg: 2.6, c: 'green' },
];
const R0 = rng(11);
T.forEach(t => { t.hist = Array.from({ length: 20 }, (_, i) => t.fail && i >= 17 ? 'f' : R0() < .05 ? 'f' : 'o'); t.durs = t.hist.map(() => .5 + R0() * .5); });
const running = new Map([[1, Date.now() - 42e3], [3, Date.now() - 198e3]]);
function fm(f, v) { return f.split(',').some(p => { let [r, s] = p.split('/'); s = s ? +s : 1; let lo, hi; if (r === '*') { lo = 0; hi = 99; } else if (r.includes('-')) { [lo, hi] = r.split('-').map(Number); } else { lo = +r; hi = s > 1 ? 99 : lo; } return v >= lo && v <= hi && (v - lo) % s === 0; }); }
function cm(e, d) { const [a, b, c, m, w] = e.split(' '); return fm(a, d.getMinutes()) && fm(b, d.getHours()) && fm(c, d.getDate()) && fm(m, d.getMonth() + 1) && fm(w, d.getDay()); }
function next(t) { if (!t.cron) return null; if (t._n > Date.now()) return t._n; const d = new Date(); d.setSeconds(0, 0); for (let i = 0; i < 11520; i++) { d.setMinutes(d.getMinutes() + 1); if (cm(t.cron, d)) return t._n = d.getTime(); } }
const left = ms => { const s = Math.max(0, Math.round(ms / 1000)); return s < 3600 ? `${pad2(Math.floor(s / 60))}:${pad2(s % 60)}` : `${Math.floor(s / 3600)} 时 ${pad2(Math.floor(s % 3600 / 60))} 分`; };
const elap = ms => { const s = Math.floor(ms / 1000); return `${Math.floor(s / 60)}:${pad2(s % 60)}`; };
const greet = () => { const h = new Date().getHours(); return h < 5 ? '夜深了' : h < 11 ? '早上好' : h < 14 ? '中午好' : h < 18 ? '下午好' : '晚上好'; };
const tint = c => `--t:var(--tint-${c === 'indigo' ? 'blue' : c});--c:var(--${c})`;
const seg = (items, on = 0) => `<div class="seg" data-seg>${items.map((x, i) => `<button class="${i === on ? 'on' : ''}">${x}</button>`).join('')}<span class="thumb" style="width:calc((100% - 8px) / ${items.length});transform:translateX(${on * 100}%)"></span></div>`;

/* ---------- 页面 ---------- */
function pTasks() {
  const pins = [T[5], T[0], T[1]];
  const slide = (t, i) => {
    const run = running.has(t.id), nr = next(t), st = run ? ['运行中', 'blue', 'i-spin'] : t.fail ? ['连续失败 3 次', 'red', 'i-x'] : ['上次成功', 'green', 'i-check'];
    return `<div class="slide r" style="--i:${i + 2}"><div class="top"><span class="tile" style="${tint(st[1])}">${ic(st[2], run ? 'spinme' : '')}</span><div><b>${t.n}</b><small>${st[0]} · ${t.h}</small></div></div>
      <div class="bars">${t.hist.map((h, k) => `<i class="${h === 'f' ? 'f' : ''}" style="height:${(30 + t.durs[k] * 70).toFixed(0)}%;--d:${k}"></i>`).join('')}</div>
      <div class="meta"><span>成功率<b>${t.fail ? '81%' : '99%'}</b></span><span>平均耗时<b>${t.avg}s</b></span><span>下一次<b class="mono" data-next="${t.id}">${nr ? left(nr - Date.now()) : '—'}</b></span></div></div>`;
